# This is a Databricks asset bundle definition for my_first_pipeline.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: my_first_pipeline
  uuid: b566cf6b-1604-4be2-8221-4139843de73f

include:
  - resources/*.yml
  - resources/*/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-cf4f0dd2-257c.cloud.databricks.com
    variables:
      catalog: practise
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-cf4f0dd2-257c.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/ajith.sarkar2025@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/ajith.sarkar2025@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: practise
      schema: prod
    permissions:
      - user_name: ajith.sarkar2025@gmail.com
        level: CAN_MANAGE
